name: SeeTarot
options:
  bundleIdPrefix: com.seetarot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  SeeTarotFeatures:
    path: Packages/SeeTarotFeatures
  SeeTarotCore:
    path: Packages/SeeTarotCore
  SeeTarotNetworking:
    path: Packages/SeeTarotNetworking
  SeeTarotPersistence:
    path: Packages/SeeTarotPersistence
  SeeTarotDesignSystem:
    path: Packages/SeeTarotDesignSystem
  SeeTarotCardEngine:
    path: Packages/SeeTarotCardEngine
schemes:
  SeeTarot:
    build:
      targets:
        SeeTarot: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SeeTarotDesignSystemTests:
    build:
      targets:
        SeeTarot: test
    test:
      targets:
        - package: SeeTarotDesignSystem/SeeTarotDesignSystemTests
  SeeTarotCardEngineTests:
    build:
      targets:
        SeeTarot: test
    test:
      targets:
        - package: SeeTarotCardEngine/SeeTarotCardEngineTests
  SeeTarotFeaturesTests:
    build:
      targets:
        SeeTarot: test
    test:
      targets:
        - package: SeeTarotFeatures/SeeTarotFeaturesTests
targets:
  SeeTarot:
    type: application
    platform: iOS
    sources:
      - path: SeeTarot
        excludes:
          - "Info.plist"
          - "Config/*.xcconfig"
    configFiles:
      Debug: SeeTarot/Config/Debug.xcconfig
      Release: SeeTarot/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seetarot.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SeeTarot/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 2BMZMX95V3
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SeeTarotFeatures
      - package: SeeTarotCore
      - package: SeeTarotNetworking
      - package: SeeTarotPersistence
      - package: SeeTarotDesignSystem
      - package: SeeTarotCardEngine
