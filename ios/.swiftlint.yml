# Lenient per development-rules.md: no syntax/compile errors, not strict style.
excluded:
  - ".build"
  - "Packages/**/.build"
  - ".xcdd"
  - "DerivedData"
disabled_rules:
  - trailing_whitespace
  - todo
  - static_over_final_class   # opt-in style; not a correctness concern
  - statement_position        # cosmetic brace placement
line_length:
  warning: 140
  error: 220
file_length:
  warning: 200
  error: 400
identifier_name:
  # Short idiomatic local names (q, u, e, fm, ts) are intentional and clear
  # in scope. Per development-rules.md: lenient style, no correctness gate.
  min_length: 1
